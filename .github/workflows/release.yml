name: Build and Release Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test API contracts
        shell: pwsh
        run: |
          dotnet run --project Lolia.Tests/Lolia.Tests.csproj -c Release -- --network-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish Lolia.App/Lolia.App.csproj -c Release -r win-x64 --self-contained true -o dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish Lolia.Service/Lolia.Service.csproj -c Release -r win-x64 --self-contained true -o dist/Service
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest 'https://github.com/Lolia-FRP/lolia-frp/releases/download/v0.71.2/LoliaFrp_windows_amd64.zip' -OutFile frpc-upstream.zip
          if ((Get-FileHash frpc-upstream.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '208a9a4c6d4d6f0a3c07cd2257c821b8cf3d7e49b809b34e3d5f2367dcb9127e') { throw 'Official frpc checksum mismatch' }
          Expand-Archive frpc-upstream.zip -DestinationPath upstream-client
          $frpc = Get-ChildItem upstream-client -Filter frpc.exe -Recurse | Select-Object -First 1
          if (-not $frpc) { throw 'Official frpc executable not found' }
          Copy-Item $frpc.FullName dist/frpc.exe
          dotnet run --project Lolia.Tests/Lolia.Tests.csproj -c Release -- --engine-test frpc-upstream.zip dist/frpc.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item install-service.ps1,install-service.cmd,uninstall-service.cmd,README.md,README.zh-CN.md,LICENSE,THIRD-PARTY-NOTICES.md dist/
          if (-not (Test-Path dist/LICENSE)) { throw 'Project license missing from distribution' }
          Copy-Item docs dist/docs -Recurse
          Copy-Item licenses dist/licenses -Recurse
      - name: Verify service installation and IPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmd.exe /c dist\install-service.cmd
          if ($LASTEXITCODE) { throw 'Service installation failed' }
          $engine = Join-Path $env:ProgramFiles 'LoliaBloom/Engine/frpc.exe'
          $engineHash = (Get-FileHash $engine).Hash
          $engineVersion = Join-Path $env:ProgramFiles 'LoliaBloom/Engine/engine-version.txt'
          'v99.0.0' | Set-Content $engineVersion -Encoding ASCII
          & cmd.exe /c dist\install-service.cmd
          if ($LASTEXITCODE) { throw 'Service upgrade failed' }
          if ((Get-Content $engineVersion -Raw).Trim() -ne 'v99.0.0' -or (Get-FileHash $engine).Hash -ne $engineHash) { throw 'Installer overwrote newer FRP' }
          'v0.71.2' | Set-Content $engineVersion -Encoding ASCII
          try {
            (Get-Service LoliaBloomService).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            function Invoke-ServiceCommand($command) {
              $pipe = [IO.Pipes.NamedPipeClientStream]::new('.', 'LoliaBloomPipe', [IO.Pipes.PipeDirection]::InOut)
              $pipe.Connect(15000)
              try {
                $writer = [IO.StreamWriter]::new($pipe)
                $writer.AutoFlush = $true
                $reader = [IO.StreamReader]::new($pipe)
                $writer.WriteLine(($command | ConvertTo-Json -Depth 10 -Compress))
                $reply = $reader.ReadLineAsync().WaitAsync([TimeSpan]::FromSeconds(15)).GetAwaiter().GetResult() | ConvertFrom-Json
                if (-not $reply.ok) { throw $reply.message }
                return $reply
              } finally { $pipe.Dispose() }
            }
            Invoke-ServiceCommand @{action='list'}
            $tunnels = @(@{id='99999999';name='CI contract test A';credential='ci-only-credential';autoStart=$false},@{id='99999998';name='CI contract test B';credential='ci-only-credential-b';autoStart=$false}) | ConvertTo-Json -AsArray -Compress
            Invoke-ServiceCommand @{action='sync';value=$tunnels}
            $saved = [IO.File]::ReadAllBytes("$env:ProgramData/LoliaBloom/tunnels.json")
            if ([Text.Encoding]::UTF8.GetString($saved).Contains('ci-only-credential')) { throw 'Credential was saved without encryption' }
            Invoke-ServiceCommand @{action='auto';id='99999999';value='true'}
            Invoke-ServiceCommand @{action='auto';id='99999998';value='false'}
            Invoke-ServiceCommand @{action='sync';value=$tunnels}
            $before = (Invoke-ServiceCommand @{action='list'}).data | ConvertFrom-Json
            if (-not ($before | Where-Object id -eq '99999999').autoStart -or ($before | Where-Object id -eq '99999998').autoStart) { throw 'Independent switches or sync preservation failed' }
            Stop-Service LoliaBloomService
            Move-Item $engine "$engine.ci-disabled"
            Start-Service LoliaBloomService
            (Get-Service LoliaBloomService).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            $reply = Invoke-ServiceCommand @{action='list'}
            if ($reply.data.Contains('ci-only-credential')) { throw 'Credential leaked through list IPC' }
            $items = $reply.data | ConvertFrom-Json
            if (@($items).Count -ne 2 -or -not ($items | Where-Object id -eq '99999999').autoStart -or ($items | Where-Object id -eq '99999998').autoStart) { throw 'Independent startup settings did not survive service restart' }
            Invoke-ServiceCommand @{action='auto';id='99999999';value='false'}
            $off = (Invoke-ServiceCommand @{action='list'}).data | ConvertFrom-Json
            if (@($off | Where-Object autoStart).Count -ne 0) { throw 'Switch off was not persisted' }
            Write-Host 'PASS: per-tunnel switches, sync preservation, encrypted restart persistence and switch off'
            Invoke-ServiceCommand @{action='sync';value='[]'}
          } finally {
            Stop-Service LoliaBloomService -ErrorAction SilentlyContinue
            if (Test-Path "$engine.ci-disabled") { Move-Item "$engine.ci-disabled" $engine -Force }
            sc.exe delete LoliaBloomService
          }
          $app = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--screenshot', (Join-Path $PWD 'LoliaBloom-screenshot.png') -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Screenshot timed out' }
          if (-not (Test-Path LoliaBloom-screenshot.png)) { throw 'Screenshot missing' }
          Compress-Archive dist/* LoliaBloom-win-x64.zip -Force
          Copy-Item LoliaBloom-win-x64.zip payload.zip
          dotnet publish Lolia.Launcher/Lolia.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item release/LoliaBloom.exe LoliaBloom-win-x64.exe
          $single = Start-Process (Join-Path $PWD 'LoliaBloom-win-x64.exe') -ArgumentList '--self-test','--screenshot',(Join-Path $PWD 'single-file-screenshot.png') -PassThru
          if (-not $single.WaitForExit(90000)) { $single.Kill(); throw 'Single EXE startup timed out' }
          if ($single.ExitCode -ne 0 -or -not (Test-Path single-file-screenshot.png)) { throw 'Single EXE launch failed' }
          Copy-Item single-file-screenshot.png LoliaBloom-screenshot.png -Force
          $create = Start-Process (Join-Path $PWD 'LoliaBloom-win-x64.exe') -ArgumentList '--self-test','--create-screenshot',(Join-Path $PWD 'LoliaBloom-create.png') -PassThru
          if (-not $create.WaitForExit(90000) -or $create.ExitCode -ne 0 -or -not (Test-Path LoliaBloom-create.png)) { throw 'Create window launch failed' }
          $details = Start-Process (Join-Path $PWD 'LoliaBloom-win-x64.exe') -ArgumentList '--self-test','--details-screenshot',(Join-Path $PWD 'LoliaBloom-details.png') -PassThru
          if (-not $details.WaitForExit(90000) -or $details.ExitCode -ne 0 -or -not (Test-Path LoliaBloom-details.png)) { throw 'Details window launch failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: LoliaBloom-win-x64
          path: |
            LoliaBloom-win-x64.exe
            LoliaBloom-win-x64.zip
            LoliaBloom-screenshot.png
            LoliaBloom-create.png
            LoliaBloom-details.png
          if-no-files-found: error
      - name: Publish v0.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.7.0 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'v0.7.0 already exists; skipping the duplicate release.'; exit 0 }
          gh release create v0.7.0 LoliaBloom-win-x64.exe LoliaBloom-win-x64.zip LoliaBloom-screenshot.png LoliaBloom-create.png LoliaBloom-details.png --target '${{ github.sha }}' --title '洛链绽放 · Lolia Bloom v0.7.0' --notes 'Adds a Linux Docker web manager for Lolia FRP tunnels with secure administrator login, cloud sync, per-tunnel start/stop and startup switches, container network traffic charts and verified FRP updates. Keeps the Windows x64 single-file and ZIP releases.'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

name: Build and Release Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test API contracts
        shell: pwsh
        run: |
          dotnet run --project Lolia.Tests/Lolia.Tests.csproj -c Release -- --network-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish Lolia.App/Lolia.App.csproj -c Release -r win-x64 --self-contained true -o dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish Lolia.Service/Lolia.Service.csproj -c Release -r win-x64 --self-contained true -o dist/Service
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest 'https://github.com/Lolia-FRP/lolia-frp/releases/download/v0.71.2/LoliaFrp_windows_amd64.zip' -OutFile frpc-upstream.zip
          if ((Get-FileHash frpc-upstream.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '208a9a4c6d4d6f0a3c07cd2257c821b8cf3d7e49b809b34e3d5f2367dcb9127e') { throw 'Official frpc checksum mismatch' }
          Expand-Archive frpc-upstream.zip -DestinationPath upstream-client
          $frpc = Get-ChildItem upstream-client -Filter frpc.exe -Recurse | Select-Object -First 1
          if (-not $frpc) { throw 'Official frpc executable not found' }
          Copy-Item $frpc.FullName dist/frpc.exe
          dotnet run --project Lolia.Tests/Lolia.Tests.csproj -c Release -- --engine-test frpc-upstream.zip dist/frpc.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item install-service.ps1,install-service.cmd,uninstall-service.cmd,README.md,README.zh-CN.md,LICENSE,THIRD-PARTY-NOTICES.md dist/
          if (-not (Test-Path dist/LICENSE)) { throw 'Project license missing from distribution' }
          Copy-Item docs dist/docs -Recurse
          Copy-Item licenses dist/licenses -Recurse
      - name: Verify window scrolling and maximized footer
        shell: pwsh
        run: |
          $layout = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--layout-self-test',(Join-Path $PWD 'layout-test.log') -PassThru
          if (-not $layout.WaitForExit(45000)) { $layout.Kill(); throw 'Layout regression test timed out' }
          Get-Content layout-test.log
          if ($layout.ExitCode -ne 0) { throw 'Layout regression test failed' }
      - name: Verify automatic web check-in
        shell: pwsh
        run: |
          $checkin = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--checkin-self-test',(Join-Path $PWD 'checkin-test.log') -PassThru
          if (-not $checkin.WaitForExit(120000)) { $checkin.Kill(); throw 'Web check-in test timed out' }
          Get-Content checkin-test.log
          if ($checkin.ExitCode -ne 0) { throw 'Web check-in regression test failed' }
      - name: Verify service installation and IPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--install-service','--install-log',(Join-Path $PWD 'native-install.log') -PassThru -Wait
          if (Test-Path native-install.log) { Get-Content native-install.log } else { throw ('Installer produced no log; exit=' + $installer.ExitCode) }
          if ($installer.ExitCode -ne 0) { throw 'Native service installer failed' }
          $engine = Join-Path $env:ProgramFiles 'LoliaBloom/Engine/frpc.exe'
          $engineHash = (Get-FileHash $engine).Hash
          $engineVersion = Join-Path $env:ProgramFiles 'LoliaBloom/Engine/engine-version.txt'
          'v99.0.0' | Set-Content $engineVersion -Encoding ASCII
          Remove-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LoliaBloomService' -Name DelayedAutoStart -ErrorAction SilentlyContinue
          $installer = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--install-service','--install-log',(Join-Path $PWD 'native-install.log') -PassThru -Wait
          if (Test-Path native-install.log) { Get-Content native-install.log } else { throw ('Installer produced no log; exit=' + $installer.ExitCode) }
          if ($installer.ExitCode -ne 0) { throw 'Native service installer failed' }
          if ((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LoliaBloomService').DelayedAutoStart -ne 0) { throw 'Missing delayed autostart value was not repaired' }
          if ((Get-Content $engineVersion -Raw).Trim() -ne 'v99.0.0' -or (Get-FileHash $engine).Hash -ne $engineHash) { throw 'Installer overwrote newer FRP' }
          $damaged = Get-Service LoliaBloomService
          $damaged.Stop()
          $damaged.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
          $damaged.Dispose()
          Remove-Item 'HKLM:\SYSTEM\CurrentControlSet\Services\LoliaBloomService' -Recurse -Force
          $repair = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--install-service','--install-log',(Join-Path $PWD 'damaged-registration.log') -PassThru -Wait
          Get-Content damaged-registration.log
          if ($repair.ExitCode -ne 0) { throw 'Repair of orphaned SCM registration failed' }
          if ((Get-Content $engineVersion -Raw).Trim() -ne 'v99.0.0' -or (Get-FileHash $engine).Hash -ne $engineHash) { throw 'Registration repair changed the FRP engine' }
          Write-Host 'PASS: orphaned service registry repaired without deleting user data or newer FRP'
          'v0.71.2' | Set-Content $engineVersion -Encoding ASCII
          try {
            (Get-Service LoliaBloomService).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            function Invoke-ServiceCommand($command) {
              $pipe = [IO.Pipes.NamedPipeClientStream]::new('.', 'LoliaBloomPipe', [IO.Pipes.PipeDirection]::InOut)
              $pipe.Connect(15000)
              try {
                $writer = [IO.StreamWriter]::new($pipe)
                $writer.AutoFlush = $true
                $reader = [IO.StreamReader]::new($pipe)
                $writer.WriteLine(($command | ConvertTo-Json -Depth 10 -Compress))
                $reply = $reader.ReadLineAsync().WaitAsync([TimeSpan]::FromSeconds(15)).GetAwaiter().GetResult() | ConvertFrom-Json
                if (-not $reply.ok) { throw $reply.message }
                return $reply
              } finally { $pipe.Dispose() }
            }
            Invoke-ServiceCommand @{action='list'}
            $tunnels = @(@{id='99999999';name='CI contract test A';credential='ci-only-credential';autoStart=$false},@{id='99999998';name='CI contract test B';credential='ci-only-credential-b';autoStart=$false}) | ConvertTo-Json -AsArray -Compress
            Invoke-ServiceCommand @{action='sync';value=$tunnels}
            $saved = [IO.File]::ReadAllBytes("$env:ProgramData/LoliaBloom/tunnels.json")
            if ([Text.Encoding]::UTF8.GetString($saved).Contains('ci-only-credential')) { throw 'Credential was saved without encryption' }
            Invoke-ServiceCommand @{action='auto';id='99999999';value='true'}
            Invoke-ServiceCommand @{action='auto';id='99999998';value='false'}
            Invoke-ServiceCommand @{action='sync';value=$tunnels}
            $before = (Invoke-ServiceCommand @{action='list'}).data | ConvertFrom-Json
            if (-not ($before | Where-Object id -eq '99999999').autoStart -or ($before | Where-Object id -eq '99999998').autoStart) { throw 'Independent switches or sync preservation failed' }
            Stop-Service LoliaBloomService
            Move-Item $engine "$engine.ci-disabled"
            Start-Service LoliaBloomService
            (Get-Service LoliaBloomService).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            $reply = Invoke-ServiceCommand @{action='list'}
            if ($reply.data.Contains('ci-only-credential')) { throw 'Credential leaked through list IPC' }
            $items = $reply.data | ConvertFrom-Json
            if (@($items).Count -ne 2 -or -not ($items | Where-Object id -eq '99999999').autoStart -or ($items | Where-Object id -eq '99999998').autoStart) { throw 'Independent startup settings did not survive service restart' }
            $failedRow = $items | Where-Object id -eq '99999999'
            if (-not $failedRow.lastError -or -not $failedRow.startupStatus -or -not $failedRow.recentLog) { throw 'Startup failure diagnostics missing' }
            if ($reply.data.Contains('ci-only-credential')) { throw 'Credential leaked in diagnostic report' }
            Invoke-ServiceCommand @{action='auto';id='99999999';value='false'}
            $off = (Invoke-ServiceCommand @{action='list'}).data | ConvertFrom-Json
            if (@($off | Where-Object autoStart).Count -ne 0) { throw 'Switch off was not persisted' }
            Write-Host 'PASS: per-tunnel switches, sync preservation, encrypted restart persistence and switch off'
            # Exercise stop + log callbacks against a continuously writing process.
            Stop-Service LoliaBloomService
            dotnet publish Lolia.Tests/Lolia.Tests.csproj -c Release -r win-x64 --self-contained true -o process-fixture
            if ($LASTEXITCODE) { throw 'Failed to build lifecycle fixture' }
            if (Test-Path "$engine.ci-disabled") { Move-Item "$engine.ci-disabled" $engine -Force }
            Copy-Item $engine "$engine.real" -Force
            Copy-Item process-fixture/* (Split-Path $engine) -Recurse -Force
            Copy-Item process-fixture/Lolia.Tests.exe $engine -Force
            try {
              Start-Service LoliaBloomService
              (Get-Service LoliaBloomService).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
              for ($attempt=0; $attempt -lt 6; $attempt++) {
                Invoke-ServiceCommand @{action='start';id='99999999'}
                $utf8Ready = $false
                for ($poll=0; $poll -lt 30; $poll++) {
                  Start-Sleep -Milliseconds 100
                  $observed = (Invoke-ServiceCommand @{action='list'}).data
                  $sample = @($observed | ConvertFrom-Json) | Where-Object id -eq '99999999'
                  if ($sample.recentLog -and $sample.recentLog.Contains('中文连接日志')) { $utf8Ready=$true; break }
                }
                if (-not $utf8Ready -or $observed.Contains('ci-only-credential')) { Write-Host $observed; throw 'UTF-8 output or redaction regression' }
                $elapsed = [Diagnostics.Stopwatch]::StartNew()
                Invoke-ServiceCommand @{action='stop';id='99999999'}
                if ($elapsed.Elapsed.TotalSeconds -gt 8) { throw 'Noisy process stop blocked service IPC' }
                Invoke-ServiceCommand @{action='auto';id='99999999';value='true'}
                Invoke-ServiceCommand @{action='auto';id='99999999';value='false'}
                Invoke-ServiceCommand @{action='list'}
              }
              Write-Host 'PASS: repeated noisy process start/stop, UTF-8 logs, settings saves and IPC responsiveness'
            } finally {
              Stop-Service LoliaBloomService -ErrorAction SilentlyContinue
              Copy-Item "$engine.real" $engine -Force
              Remove-Item "$engine.real"
              Start-Service LoliaBloomService
              (Get-Service LoliaBloomService).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            }
            # The repair must recover only our verified service when it is stuck stopping.
            Stop-Service LoliaBloomService
            $serviceExe = Join-Path $env:ProgramFiles 'LoliaBloom/Service/Lolia.Service.exe'
            Copy-Item process-fixture/* (Split-Path $serviceExe) -Recurse -Force
            Copy-Item process-fixture/Lolia.Tests.exe $serviceExe -Force
            New-Item (Join-Path (Split-Path $serviceExe) 'hang-stop.fixture') -ItemType File -Force | Out-Null
            try { Start-Service LoliaBloomService } catch {
              Get-Content (Join-Path (Split-Path $serviceExe) 'hang-stop.log') -ErrorAction SilentlyContinue
              Get-WinEvent -LogName Application -MaxEvents 8 -ErrorAction SilentlyContinue | Format-List Message
              throw
            }
            $stuck = Get-Service LoliaBloomService
            $stuck.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            $stuck.WaitForStatus('StopPending', [TimeSpan]::FromSeconds(15))
            $stuck.Dispose()
            $recovery = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--install-service','--install-log',(Join-Path $PWD 'stop-pending-recovery.log') -PassThru -Wait
            Get-Content stop-pending-recovery.log
            if ($recovery.ExitCode -ne 0 -or -not (Select-String -Path stop-pending-recovery.log -SimpleMatch '已核对本程序服务 PID')) { throw 'Verified StopPending recovery failed' }
            Remove-Item (Join-Path (Split-Path $serviceExe) 'hang-stop.fixture') -Force
            Write-Host 'PASS: verified service PID/path recovery from a deliberately hung StopPending fixture'
            Invoke-ServiceCommand @{action='sync';value='[]'}
          } finally {
            Stop-Service LoliaBloomService -ErrorAction SilentlyContinue
            if (Test-Path "$engine.ci-disabled") { Move-Item "$engine.ci-disabled" $engine -Force }
            sc.exe delete LoliaBloomService
          }
          $app = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--screenshot', (Join-Path $PWD 'LoliaBloom-screenshot.png') -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Screenshot timed out' }
          if (-not (Test-Path LoliaBloom-screenshot.png)) { throw 'Screenshot missing' }
          Compress-Archive dist/* LoliaBloom-v0.7.13-win-x64.zip -Force
          Copy-Item LoliaBloom-v0.7.13-win-x64.zip payload.zip
          dotnet publish Lolia.Launcher/Lolia.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item release/LoliaBloom.exe LoliaBloom-v0.7.13-win-x64.exe
          $single = Start-Process (Join-Path $PWD 'LoliaBloom-v0.7.13-win-x64.exe') -ArgumentList '--self-test','--screenshot',(Join-Path $PWD 'single-file-screenshot.png') -PassThru
          if (-not $single.WaitForExit(90000)) { $single.Kill(); throw 'Single EXE startup timed out' }
          if ($single.ExitCode -ne 0 -or -not (Test-Path single-file-screenshot.png)) { throw 'Single EXE launch failed' }
          Copy-Item single-file-screenshot.png LoliaBloom-screenshot.png -Force
          dotnet run --project Lolia.Tests/Lolia.Tests.csproj -c Release -- --update-launch-test (Join-Path $PWD 'LoliaBloom-v0.7.13-win-x64.exe')
          if ($LASTEXITCODE) { throw 'Real update handoff test failed' }
          $create = Start-Process (Join-Path $PWD 'LoliaBloom-v0.7.13-win-x64.exe') -ArgumentList '--self-test','--create-screenshot',(Join-Path $PWD 'LoliaBloom-create.png') -PassThru
          if (-not $create.WaitForExit(90000) -or $create.ExitCode -ne 0 -or -not (Test-Path LoliaBloom-create.png)) { throw 'Create window launch failed' }
          $details = Start-Process (Join-Path $PWD 'LoliaBloom-v0.7.13-win-x64.exe') -ArgumentList '--self-test','--details-screenshot',(Join-Path $PWD 'LoliaBloom-details.png') -PassThru
          if (-not $details.WaitForExit(90000) -or $details.ExitCode -ne 0 -or -not (Test-Path LoliaBloom-details.png)) { throw 'Details window launch failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: LoliaBloom-win-x64
          path: |
            LoliaBloom-v0.7.13-win-x64.exe
            LoliaBloom-v0.7.13-win-x64.zip
            LoliaBloom-screenshot.png
            LoliaBloom-create.png
            LoliaBloom-details.png
          if-no-files-found: error
      - name: Publish v0.7.13
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.7.13 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'v0.7.13 already exists; skipping the duplicate release.'; exit 0 }
          gh release create v0.7.13 LoliaBloom-v0.7.13-win-x64.exe LoliaBloom-v0.7.13-win-x64.zip LoliaBloom-screenshot.png LoliaBloom-create.png LoliaBloom-details.png --target '${{ github.sha }}' --title '洛链绽放 · Lolia Bloom v0.7.13' --notes 'Adds in-app release checks and one-click verified Windows updates with progress and cancellation. The old window exits only after the new window confirms startup; the check-in worker hands off without resetting its saved countdown. New single-file downloads are saved beside the currently launched EXE, without remembering a separate download directory. Fixes scrolling with expanded diagnostics and keeps the maximized footer above the taskbar. Includes actual window layout checks, update manifest, integrity and cancellation tests plus existing browser and service regression checks.'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

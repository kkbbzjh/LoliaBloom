name: Build and Release Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish Lolia.App/Lolia.App.csproj -c Release -r win-x64 --self-contained true -o dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish Lolia.Service/Lolia.Service.csproj -c Release -r win-x64 --self-contained true -o dist/Service
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item install-service.cmd,uninstall-service.cmd,README.md,README.zh-CN.md dist/
      - name: Verify service installation and IPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmd.exe /c dist\install-service.cmd
          if ($LASTEXITCODE) { throw 'Service installation failed' }
          try {
            (Get-Service LoliaBloomService).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            $pipe = [IO.Pipes.NamedPipeClientStream]::new('.', 'LoliaBloomPipe', [IO.Pipes.PipeDirection]::InOut)
            $pipe.Connect(15000)
            $writer = [IO.StreamWriter]::new($pipe)
            $writer.AutoFlush = $true
            $reader = [IO.StreamReader]::new($pipe)
            $writer.WriteLine('{"action":"list"}')
            $reply = $reader.ReadLineAsync().WaitAsync([TimeSpan]::FromSeconds(15)).GetAwaiter().GetResult() | ConvertFrom-Json
            if (-not $reply.ok) { throw 'IPC request failed' }
            $pipe.Dispose()
          } finally {
            Stop-Service LoliaBloomService -ErrorAction SilentlyContinue
            sc.exe delete LoliaBloomService
          }
          $app = Start-Process (Join-Path $PWD 'dist/Lolia.App.exe') -ArgumentList '--screenshot', (Join-Path $PWD 'LoliaBloom-screenshot.png') -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Screenshot timed out' }
          if (-not (Test-Path LoliaBloom-screenshot.png)) { throw 'Screenshot missing' }
          Compress-Archive dist/* LoliaBloom-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LoliaBloom-win-x64
          path: |
            LoliaBloom-win-x64.zip
            LoliaBloom-screenshot.png
          if-no-files-found: error
      - name: Publish v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.4.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagSha = gh api repos/kkbbzjh/LoliaBloom/git/ref/tags/v0.4.0 --jq '.object.sha'
            if ($tagSha -ne 'ce47e300a6159498a8b7a537aa57b57a47ad5376') { throw 'Existing release is not from this initial build; refusing replacement.' }
            gh api --method PATCH repos/kkbbzjh/LoliaBloom/git/refs/tags/v0.4.0 -f sha='${{ github.sha }}' -F force=false
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release upload v0.4.0 LoliaBloom-win-x64.zip LoliaBloom-screenshot.png --clobber
            exit $LASTEXITCODE
          }
          gh release create v0.4.0 LoliaBloom-win-x64.zip LoliaBloom-screenshot.png --target '${{ github.sha }}' --title 'Lolia Bloom v0.4.0' --notes 'Windows x64 portable prototype. Includes one-click Windows Service installation. OAuth, tunnel API, check-in and traffic integrations still require live verification; see README.'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

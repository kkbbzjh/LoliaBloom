name: Build and publish Linux Docker images
on: []
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kkbbzjh/loliabloom
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Lolia Bloom Web
            org.opencontainers.image.description=Linux Docker web manager for Lolia FRP
            org.opencontainers.image.source=https://github.com/kkbbzjh/LoliaBloom
            org.opencontainers.image.licenses=LicenseRef-LoliaBloom-Noncommercial
      - name: Build and push amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the published amd64 image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'docker logs loliabloom-smoke 2>&1; docker rm -f loliabloom-smoke' EXIT
          docker pull ghcr.io/kkbbzjh/loliabloom:sha-${GITHUB_SHA::7}
          docker run -d --name loliabloom-smoke -e LOLIABLOOM_ADMIN_PASSWORD='workflow-test-password-123' -p 127.0.0.1:18080:8080 ghcr.io/kkbbzjh/loliabloom:sha-${GITHUB_SHA::7}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)
          test "$status" = 302
